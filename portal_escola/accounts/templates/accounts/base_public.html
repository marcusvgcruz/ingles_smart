{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Login - Inglês Smart</title>
    {% include "accounts/includes/pwa_head.html" %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/css/responsive.css' %}">
</head>
<body class="login-corporate-body">

    <div class="login-corporate-wrapper">

        <div class="login-corporate-brand">
            <img src="{% static 'accounts/img/logo.png' %}" alt="Inglês Smart">
        </div>

        <div class="login-corporate-card">
            {% block content %}{% endblock %}
        </div>
        <div class="login-footer">
            © 2026 Inglês Smart • Sistema Acadêmico
        </div>

    </div>

<script src="{% static 'accounts/js/pwa-register.js' %}"></script>
</body>
</html>
