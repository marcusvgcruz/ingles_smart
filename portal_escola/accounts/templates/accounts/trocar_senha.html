{% extends 'accounts/base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Change password</h1>
        <p>Use a strong password you do not reuse elsewhere.</p>
    </div>
</div>

<div class="card" style="max-width: 480px;">
    <form method="post" class="form-grid">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_current_password">Current password</label>
            <input type="password" name="current_password" id="id_current_password" class="form-control" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="id_new_password">New password</label>
            <input type="password" name="new_password" id="id_new_password" class="form-control" required minlength="8" autocomplete="new-password">
            <small class="text-muted">At least 8 characters.</small>
        </div>
        <div class="form-group">
            <label for="id_confirm_password">Confirm new password</label>
            <input type="password" name="confirm_password" id="id_confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group" style="display:flex;gap:12px;align-items:center;">
            <button type="submit" class="btn btn-primary">Update password</button>
            <a href="{% url 'perfil' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
