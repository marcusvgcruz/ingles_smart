{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Create Class</h1>
        <p>Create a new class schedule</p>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}
{% if next_path %}
<input type="hidden" name="next" value="{{ next_path }}">
{% endif %}

<div class="form-group">
<label>Class Name</label>
{{ form.name }}
</div>


<!-- NOVO CAMPO ROOM -->

<div class="form-group">
<label>Room</label>
{{ form.room }}
</div>




<hr class="section-divider">

<h3>Select Time Blocks</h3>
<p>Use search to filter blocks by weekday/time.</p><br>

<div class="form-group">

{{ form.time_blocks }}

</div>

<div class="form-actions">

<button class="btn btn-primary">
Create Class
</button>

</div>

</form>

</div>

{% endblock %}
