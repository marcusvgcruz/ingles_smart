{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Cadastre os dias da semana para criar horários automaticamente.</p>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-group">
<label>Name</label>
{{ form.name }}
</div>

<div class="form-group">
<label>Room</label>
{{ form.room }}
</div>

<div class="form-grid2">

<div class="form-group">
<label>Start Date</label>
{{ form.start_date }}
</div>

<div class="form-group">
<label>End Date</label>
{{ form.end_date }}
</div>

</div>

<hr class="section-divider">

<h3>Select Time Blocks</h3>

<div class="form-group">
{{ form.time_blocks }}
</div>

<div class="form-actions">

<button type="submit" class="btn btn-primary">
Salvar
</button>

<a href="{% url 'lista_turmas' %}" class="btn btn-secondary">
Voltar
</a>

</div>

</form>

</div>

{% endblock %}
