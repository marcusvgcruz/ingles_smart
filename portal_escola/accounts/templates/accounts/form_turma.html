{% extends 'accounts/base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Cadastre os dias da semana para criar horários automaticamente.</p>
    </div>
</div>

<form method="post" class="form-box" style="max-width: 600px;">
    {% csrf_token %}
    {{ form.as_p }}

    <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'lista_turmas' %}" class="btn btn-secondary">Voltar</a>
    </div>
</form>
{% endblock %}
