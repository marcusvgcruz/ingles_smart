{% extends 'accounts/base.html' %}

{% block content %}
<h2>Mark Attendance - {{ lesson.class_group.name }} ({{ lesson.date }} {{ lesson.start_time|time:"H:i" }})</h2>

<form method="POST">
    {% csrf_token %}

    {% for aluno in alunos %}
        <div>
            <label>
                <input type="checkbox" name="aluno_{{ aluno.id }}">
                {{ aluno.user.get_full_name|default:aluno.user.username }}
            </label>
        </div>
    {% empty %}
        <p>No Global Cityzens are linked to this lesson.</p>
    {% endfor %}

    <div style="display:flex; gap:8px; margin-top: 12px;">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'lista_turmas' %}" class="btn btn-secondary">Back</a>
    </div>
</form>
{% endblock %}
