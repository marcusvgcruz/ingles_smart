{% extends "accounts/base.html" %}

{% block content %}

<div class="page-header">

<h1>{{ titulo }}</h1>

</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-group">
<label>Nome</label>
{{ form.nome }}
</div>

<div class="form-group">
<label>Ordem</label>
{{ form.ordem }}
</div>

<div class="form-group checkbox-group">
    <label>
        {{ form.ativo }} Ativo
    </label>
</div>

<button class="btn btn-primary">
Salvar
</button>

<a href="{% url 'lista_competencias' %}" class="btn btn-secondary">
Voltar
</a>

</form>

</div>

{% endblock %}
