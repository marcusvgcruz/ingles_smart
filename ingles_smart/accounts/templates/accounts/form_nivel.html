{% extends "accounts/base.html" %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Set the proficiency level name, order and status.</p>
    </div>
    <div class="page-header-actions">
        <a href="{% url 'lista_competencias' %}" class="btn btn-secondary btn-sm">← Back to list</a>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-grid2">

<div class="form-group">
<label>Name</label>
{{ form.nome }}
</div>

<div class="form-group">
<label>Order</label>
{{ form.ordem }}
</div>

<div class="form-group checkbox-group">
    <label>
        {{ form.ativo }} Active
    </label>
</div>

</div>

<div class="form-actions">

<a href="{% url 'lista_competencias' %}" class="btn btn-secondary">
Back
</a>

<button type="submit" class="btn btn-primary">
Save
</button>

</div>

</form>

</div>

{% endblock %}
