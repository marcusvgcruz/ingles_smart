{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Create Template</h1>
        <p>Create a weekly schedule template</p>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-group">
<label>Name</label>
{{ form.name }}
</div>

<div class="form-group checkbox-group">
<label>
{{ form.active }} Active
</label>
</div>

<div class="form-actions">

<button class="btn btn-primary">
Create Template
</button>

<a href="{% url 'lista_templates' %}" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>

{% endblock %}
