{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>Edit Blocked Period</h1>
        <p>{{ period.name }}</p>
    </div>
    <a href="{% url 'lista_blocked_periods' %}" class="btn btn-secondary">Back</a>
</div>

<div class="form-container">
<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label>Name</label>
        {{ form.name }}
    </div>

    <div class="form-group">
        <label>Start Date</label>
        {{ form.start_date }}
    </div>

    <div class="form-group">
        <label>End Date</label>
        {{ form.end_date }}
    </div>

    <div class="form-actions">
        <button class="btn btn-primary">Save changes</button>
    </div>
</form>
</div>

{% endblock %}
