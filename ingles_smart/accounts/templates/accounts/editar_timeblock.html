{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>Edit Time Block</h1>
        <p>{{ template.name }} — adjust the day and time for this block.</p>
    </div>
    <div class="page-header-actions">
        <a href="{% url 'detalhe_template' template.id %}" class="btn btn-secondary btn-sm">← Back</a>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Day</label>
{{ form.weekday }}
</div>

<div class="form-group">
<label>Start Time</label>
{{ form.start_time }}
</div>

<div class="form-group">
<label>End Time</label>
{{ form.end_time }}
</div>

</div>

<div class="form-actions">

<button class="btn btn-primary">
Save Changes
</button>

<a href="{% url 'detalhe_template' template.id %}" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>

{% endblock %}
