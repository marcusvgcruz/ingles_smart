{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Set class data and searchable time blocks.</p>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-group">
<label>Name</label>
{{ form.name }}
</div>

<div class="form-group">
<label>Room</label>
{{ form.room }}
</div>



<hr class="section-divider">

<h3>Select Time Blocks</h3>
<p>Use search in the field below to quickly find blocks.</p>

<div class="form-group">
{{ form.time_blocks }}
</div>

<div class="form-actions">

<button type="submit" class="btn btn-primary">
Save
</button>

<a href="{% url 'lista_turmas' %}" class="btn btn-secondary">
Back
</a>

</div>

</form>

</div>

{% endblock %}
