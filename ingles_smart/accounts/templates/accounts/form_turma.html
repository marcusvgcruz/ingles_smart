{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Set class data and searchable time blocks.</p>
    </div>
    <div class="page-header-actions">
        <a href="{% url 'lista_turmas' %}" class="btn btn-secondary btn-sm">← Back to list</a>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-grid2">

<div class="form-group">
<label>Name</label>
{{ form.name }}
</div>

<div class="form-group">
<label>Room</label>
{{ form.room }}
</div>

</div>

<hr class="section-divider">

<h3>Select Time Blocks</h3>
<p class="text-muted">Use search in the field below to quickly find blocks.</p>

<div class="form-group">
<label>Time Blocks</label>
{{ form.time_blocks }}
</div>

<div class="form-actions">

<a href="{% url 'lista_turmas' %}" class="btn btn-secondary">
Back
</a>

<button type="submit" class="btn btn-primary">
Save
</button>

</div>

</form>

</div>

{% endblock %}
