{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>Edit Enrollment</h1>
        <p>{{ matricula.aluno.user.first_name }} {{ matricula.aluno.user.last_name }}</p>
    </div>
    <div class="page-header-actions">
        <a href="{% url 'detalhe_aluno' matricula.aluno.user.id %}" class="btn btn-secondary btn-sm">← Back to student</a>
    </div>
</div>

<div class="form-container">

<form method="post">

{% csrf_token %}

<div class="form-grid2">

<div class="form-group">
<label>Class</label>
{{ form.turma }}
</div>

<div class="form-group">
<label>Start Date</label>
{{ form.data_inicio }}
</div>

<div class="form-group">
<label>End Date</label>
{{ form.data_fim }}
</div>

</div>

<div class="form-actions">

<a href="{% url 'detalhe_aluno' matricula.aluno.user.id %}" class="btn btn-secondary">
Cancel
</a>

<button type="submit" class="btn btn-primary">
Save
</button>

</div>

</form>

</div>

{% endblock %}
