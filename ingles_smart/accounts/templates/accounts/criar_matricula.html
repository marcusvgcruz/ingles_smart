{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>New Enrollment</h1>
        <p>Create a new Global Cityzen enrollment.</p>
    </div>
    <div class="page-header-actions">
        <a href="{% url 'lista_alunos' %}" class="btn btn-secondary btn-sm">← Back to list</a>
    </div>
</div>

<div class="form-container">

<form method="post">
    {% csrf_token %}

    <div class="form-grid2">

    <div class="form-group">
        <label>Global Cityzen</label>
        {{ form.aluno }}
    </div>

    <div class="form-group">
        <label>Class</label>
        {{ form.turma }}
    </div>

    <div class="form-group">
        <label>Start Date</label>
        {{ form.data_inicio }}
    </div>

    <div class="form-group">
        <label>End Date</label>
        {{ form.data_fim }}
    </div>

    </div>

    <div class="form-actions">
        <a href="{% url 'lista_alunos' %}" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn btn-primary">
            Save Enrollment
        </button>
    </div>

</form>

</div>


{% endblock %}
