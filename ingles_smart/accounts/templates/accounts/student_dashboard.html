{% extends 'accounts/base.html' %}

{% block content %}

<div class="page-header page-header-split">
    <div>
        <h1>My dashboard</h1>
        <p>Your attendance and evaluation progress</p>
    </div>
</div>

<div class="dashboard">
    <div class="kpi-grid">
        <div class="card kpi">
            <h4>Attendance</h4>
            <h2>{{ attendance_rate }}%</h2>
            <span class="kpi-hint">Classes you attended</span>
        </div>
        <div class="card kpi">
            <h4>Evaluation Avg</h4>
            <h2>{{ media_avaliacao }}</h2>
            <span class="kpi-hint">Average of your evaluations</span>
        </div>
    </div>

    <div class="charts-grid">
        <div class="card">
            <h3>Attendance trend</h3>
            <div class="chart-canvas-wrap">
                <canvas id="attendanceChart"
                    data-labels='{{ attendance_labels|safe }}'
                    data-values='{{ attendance_values|safe }}'></canvas>
            </div>
        </div>
        <div class="card">
            <h3>Evaluations trend</h3>
            <div class="chart-canvas-wrap">
                <canvas id="evaluationChart"
                    data-labels='{{ evaluation_labels|safe }}'
                    data-values='{{ evaluation_values|safe }}'></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const OLTS = {
    primary: '#ff7a00',
    primarySoft: 'rgba(255, 122, 0, 0.18)',
    primaryMid: 'rgba(255, 122, 0, 0.75)',
    gray: '#9ca3af',
    border: '#ececec'
};

const attendanceCanvas = document.getElementById('attendanceChart');
const evaluationCanvas = document.getElementById('evaluationChart');

new Chart(attendanceCanvas, {
    type: 'line',
    data: {
        labels: JSON.parse(attendanceCanvas.dataset.labels),
        datasets: [{
            label: 'Attendance (%)',
            data: JSON.parse(attendanceCanvas.dataset.values),
            borderColor: OLTS.primary,
            backgroundColor: OLTS.primarySoft,
            pointBackgroundColor: OLTS.primary,
            borderWidth: 2,
            fill: true,
            tension: 0.3,
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: { beginAtZero: true, max: 100, ticks: { color: OLTS.gray }, grid: { color: OLTS.border } },
            x: { ticks: { color: OLTS.gray }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
    }
});

new Chart(evaluationCanvas, {
    type: 'bar',
    data: {
        labels: JSON.parse(evaluationCanvas.dataset.labels),
        datasets: [{
            label: 'Average score',
            data: JSON.parse(evaluationCanvas.dataset.values),
            backgroundColor: OLTS.primaryMid,
            borderColor: OLTS.primary,
            borderWidth: 1,
            borderRadius: 6,
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: { beginAtZero: true, ticks: { color: OLTS.gray }, grid: { color: OLTS.border } },
            x: { ticks: { color: OLTS.gray }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
    }
});
</script>
{% endblock %}
