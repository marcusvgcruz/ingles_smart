# Blueprint Render — opcional: no painel Render, "New" → "Blueprint" e aponte para este repo.
# Ajuste o plano do banco se precisar de mais espaço (free tem limites).

services:
  - type: web
    name: portal-escola
    runtime: python
    region: oregon
    plan: free
    rootDir: portal_escola
    buildCommand: bash ./build.sh
    startCommand: bash ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-escola-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # AWS S3 (Mídia em Produção):
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: "us-east-1"
      # Cloudinary (opcional/fallback):
      - key: CLOUDINARY_URL
        sync: false

      # E-mail no free tier: SMTP (Gmail) é bloqueado — use Brevo (https://www.brevo.com):
      # - key: BREVO_API_KEY
      #   sync: false
      # - key: BREVO_FROM_EMAIL
      #   value: seu-email-verificado@gmail.com
      # - key: BREVO_FROM_NAME
      #   value: Inglês Smart
      # - key: PORTAL_LOGIN_URL
      #   value: https://SEU-APP.onrender.com/login/
    autoDeploy: true

databases:
  - name: portal-escola-db
    plan: free
    region: oregon
